[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
description = "Escáner de puertos y reconocimiento de red ultrarrápido, sin dependencias (solo stdlib)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Netscope authors" }]
keywords = ["port-scanner", "reconnaissance", "pentesting", "security", "asyncio", "nmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dynamic = ["version"]

[project.scripts]
netscope = "netscope.cli:main"

[project.urls]
Homepage = "https://github.com/tu-usuario/netscope"
Repository = "https://github.com/tu-usuario/netscope"
Issues = "https://github.com/tu-usuario/netscope/issues"

[tool.setuptools.dynamic]
version = { attr = "netscope.constants.__version__" }

[tool.setuptools.packages.find]
include = ["netscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
